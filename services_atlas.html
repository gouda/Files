<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أطلس خدمات البوابة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E8EDEB; --ink:#16232B; --muted:#5A6A71; --line:#D6DEDC;
  --accent:#0E6B63; --accent-soft:#DCEFEC;
  --k-nibras:#0E6B63; --k-dp:#4B4FA8; --k-sql:#56646C; --k-soap:#A2560F; --k-isql:#A2384F;
  --warn:#9A6400; --warn-soft:#FBF0D9;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-disp:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1719; --surface:#162125; --sunk:#1D2A2F; --ink:#E3EBE9; --muted:#93A4A9; --line:#2A3A40;
    --accent:#52B9AD; --accent-soft:#18383A;
    --k-nibras:#52B9AD; --k-dp:#8F93E6; --k-sql:#A3B0B6; --k-soap:#E09A55; --k-isql:#E27D93;
    --warn:#E3B45A; --warn-soft:#2F2716;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1719; --surface:#162125; --sunk:#1D2A2F; --ink:#E3EBE9; --muted:#93A4A9; --line:#2A3A40;
  --accent:#52B9AD; --accent-soft:#18383A;
  --k-nibras:#52B9AD; --k-dp:#8F93E6; --k-sql:#A3B0B6; --k-soap:#E09A55; --k-isql:#E27D93;
  --warn:#E3B45A; --warn-soft:#2F2716;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px;direction:ltr;unicode-bidi:isolate}
.ltr{direction:ltr;unicode-bidi:isolate}

.app{display:grid;grid-template-rows:auto 1fr;height:100%;padding-inline:16px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.brand h1{font:600 20px/1.2 var(--f-disp);margin:0;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-inline-start:auto;font-size:12.5px;color:var(--muted)}
.stats b{font:600 15px var(--f-disp);color:var(--ink);font-variant-numeric:tabular-nums;margin-inline-end:4px}

.body{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;min-height:0;padding-block:14px}
.side{display:flex;flex-direction:column;min-height:0;gap:10px}
.tabs{display:flex;background:var(--sunk);border-radius:8px;padding:3px}
.tabs button{flex:1;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.filters select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px}
.count{font-size:12px;color:var(--muted)}
.list{overflow:auto;min-height:0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.group{position:sticky;top:0;background:var(--sunk);font:600 12px var(--f-disp);color:var(--muted);padding:6px 12px;letter-spacing:.02em;z-index:1}
.item{display:block;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;cursor:pointer}
.item:hover{background:var(--sunk)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item .t{font-weight:500;display:block}
.item .s{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tiny{font-size:11.5px;color:var(--muted)}

.detail{overflow:auto;min-height:0}
.empty{color:var(--muted);padding:40px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.dhead{display:flex;flex-direction:column;gap:6px}
.dhead h2{font:600 24px/1.3 var(--f-disp);margin:0;text-wrap:balance}
.dhead .en{color:var(--muted);direction:ltr;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);border:1px solid transparent;white-space:nowrap}
.chip.k{border-color:currentColor;background:none}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.back{display:none;border:0;background:none;color:var(--accent);padding:0 0 8px;cursor:pointer;font-weight:500}
.stack{display:flex;flex-direction:column;gap:14px}
.sec h3{font:600 14px var(--f-disp);margin:0 0 10px;color:var(--muted);letter-spacing:.02em}
.brief{font-size:15.5px;line-height:1.8;max-width:70ch;margin:0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.note textarea{width:100%;min-height:110px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical;line-height:1.7}
.note .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:500}
.btn.ghost{background:none;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.placeholder{color:var(--muted);font-style:normal;margin:0}

.kgroup+.kgroup{margin-top:14px}
.kgroup h4{margin:0 0 8px;font:600 13px var(--f-disp);display:flex;align-items:center;gap:8px}
.ints{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.int{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.int .name{font:500 14px var(--f-mono);direction:ltr;text-align:right;overflow-wrap:anywhere;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.int .name:hover{color:var(--accent)}
.lvl{font-size:11px;padding:1px 7px;border-radius:5px;align-self:flex-start}
.lvl.Page{background:var(--accent-soft);color:var(--accent)}
.lvl.Project{background:var(--sunk);color:var(--ink)}
.lvl.Library{background:var(--warn-soft);color:var(--warn)}
details{font-size:12.5px}
details summary{cursor:pointer;color:var(--muted)}
.plist{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto}
.plist li{font:12px var(--f-mono);direction:ltr;text-align:right;overflow-wrap:anywhere}
.svc-links{display:flex;flex-direction:column;gap:4px}
.svc-links a{overflow-wrap:anywhere;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);margin-top:6px}
.slist{display:flex;flex-direction:column}
.slist button{border:0;border-bottom:1px solid var(--line);background:none;text-align:start;padding:7px 2px;cursor:pointer}
.slist button:hover{color:var(--accent)}

@media (max-width:860px){
  .app{height:auto}
  .body{grid-template-columns:1fr}
  .list{max-height:none}
  .app[data-view="detail"] .side{display:none}
  .app:not([data-view="detail"]) .detail{display:none}
  .back{display:inline-block}
  .stats{margin-inline-start:0}
}
@media (prefers-reduced-motion:no-preference){.item,.int .name{transition:background .12s,color .12s}}
</style>
</head>
<body>

<div class="app" id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <h1>أطلس خدمات البوابة</h1>
      <p>كل خدمة: من يراها، صفحاتها، الكود الذي يقدمها، وتكاملاتها. المصدر: قائمة خدمات SharePoint ومسح مستودعات الكود.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="body">
    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-s" aria-selected="true">الخدمات</button>
        <button role="tab" id="tab-i" aria-selected="false">التكاملات</button>
      </div>
      <input class="search" id="q" type="search" placeholder="ابحث بالاسم، رقم الخدمة، المشروع أو التكامل…" autocomplete="off">
      <div class="filters" id="filters"></div>
      <div class="count" id="count"></div>
      <div class="list" id="list" role="list"></div>
    </aside>
    <main class="detail" id="detail"><div class="empty">اختر خدمة أو تكاملاً من القائمة.</div></main>
  </div>
</div>

<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const S = D.services, I = D.integrations, C = D.categories;
const byId = Object.fromEntries(S.map(s => [s.id, s]));

const KIND = {
  Nibras:{ar:'نبراس', hint:'REST عبر RestServiceBase أو WCF عبر Eservice.svc', v:'--k-nibras'},
  DP:{ar:'DataPower', hint:'تكاملات فريق التكامل (IntegrationDP)', v:'--k-dp'},
  DirectSQL:{ar:'قاعدة بيانات مباشرة', hint:'Entity Framework DbContext', v:'--k-sql'},
  SOAP:{ar:'SOAP / WCF خارجي', hint:'عميل خدمة ويب مولَّد', v:'--k-soap'},
  IntegrationSQL:{ar:'IntegrationSQL', hint:'مكتبة IntegrationSQL (HTTP)', v:'--k-isql'}
};
const KIND_ORDER = ['Nibras','DP','IntegrationSQL','SOAP','DirectSQL'];
const UT = {'-1':'زائر (بدون تسجيل)','1':'مستورد','2':'مخلص جمركي','3':'وكيل ملاحي','4':'مستخدم نفاذ (IAM)','5':'وكيل ملاحي بحري','6':'شحن جوي','7':'وكلاء الشحن'};
const COMP = {Captcha:'Captcha', Nafath:'نفاذ', NE:'محرك الإشعارات (NE)', Survey:'استبيان'};
const LVL = {Page:'داخل كود الصفحة', Project:'في مشروع الخدمة', Library:'في مكتبة يعتمد عليها المشروع'};

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kcolor = k => `var(${(KIND[k]||KIND.DirectSQL).v})`;
const catName = id => C[id] ? C[id].ar : (id === '-1' || !id ? 'بدون تصنيف' : 'تصنيف ' + id);
const utName = c => UT[c] || ('رمز غير معروف ' + c);
const kindsOf = s => [...new Set(s.ints.map(x => I[x.k].kind))];

let tab = 'services', current = null;
const F = {cat:'', ut:'', kind:'', state:''};
const notes = {}; let db = null, canWrite = true;

// ---------- stats
(function stats(){
  const withInt = S.filter(s => s.ints.length).length;
  const ext = S.filter(s => s.match === 'External').length;
  const kc = {}; Object.values(I).forEach(i => kc[i.kind] = (kc[i.kind]||0) + 1);
  $('#stats').innerHTML =
    `<span><b>${S.length}</b>خدمة</span><span><b>${withInt}</b>لها تكاملات في الكود</span>` +
    `<span><b>${ext}</b>خارجية (فسح وغيرها)</span><span><b>${Object.keys(I).length}</b>تكاملاً مستخدماً</span>`;
})();

// ---------- filters
function buildFilters(){
  const f = $('#filters');
  if (tab === 'services'){
    const cats = [...new Set(S.map(s => s.cat))].sort((a,b) => catName(a).localeCompare(catName(b),'ar'));
    const uts = [...new Set(S.flatMap(s => s.ut))].sort((a,b) => +a - +b);
    f.innerHTML =
      sel('cat','كل التصنيفات', cats.map(c => [c, catName(c)])) +
      sel('ut','كل المستخدمين', uts.map(u => [u, utName(u)])) +
      sel('kind','كل أنواع التكامل', KIND_ORDER.map(k => [k, KIND[k].ar])) +
      sel('state','كل الحالات', [['code','لها كود في المستودعات'],['ext','خارجية'],['noint','بدون تكاملات مكتشفة'],['review','تحتاج مراجعة']]);
  } else {
    f.innerHTML = sel('kind','كل الأنواع', KIND_ORDER.map(k => [k, KIND[k].ar]));
  }
  f.querySelectorAll('select').forEach(el => el.addEventListener('change', () => { F[el.dataset.f] = el.value; renderList(); }));
}
function sel(key, all, opts){
  return `<select id="f-${key}" data-f="${key}" aria-label="${esc(all)}"><option value="">${esc(all)}</option>` +
    opts.map(([v,t]) => `<option value="${esc(v)}"${F[key]===v?' selected':''}>${esc(t)}</option>`).join('') + '</select>';
}

// ---------- list
function needsReview(s){ return s.match === 'NotFound' || s.match === 'WebRootOnly' || s.source === 'OldRepoOnly' || s.projects.length > 1; }
function matchS(s, q){
  if (F.cat && s.cat !== F.cat) return false;
  if (F.ut && !s.ut.includes(F.ut)) return false;
  if (F.kind && !kindsOf(s).includes(F.kind)) return false;
  if (F.state === 'code' && !s.projects.length) return false;
  if (F.state === 'ext' && s.match !== 'External') return false;
  if (F.state === 'noint' && s.ints.length) return false;
  if (F.state === 'review' && !needsReview(s)) return false;
  if (!q) return true;
  const hay = [s.id, s.ar, s.en, s.web, s.page, ...s.repos, ...s.projects, ...s.ints.map(x => I[x.k].cls), notes[s.id]||''].join(' ').toLowerCase();
  return q.split(/\s+/).every(t => hay.includes(t));
}
function renderList(){
  const q = $('#q').value.trim().toLowerCase();
  const list = $('#list'); let html = '', n = 0;
  if (tab === 'services'){
    const groups = {};
    S.filter(s => matchS(s, q)).forEach(s => (groups[s.cat] ||= []).push(s));
    Object.keys(groups).sort((a,b) => catName(a).localeCompare(catName(b),'ar')).forEach(g => {
      html += `<div class="group">${esc(catName(g))} · ${groups[g].length}</div>`;
      groups[g].forEach(s => {
        n++;
        const dots = kindsOf(s).map(k => `<span class="dot" title="${esc(KIND[k].ar)}" style="background:${kcolor(k)}"></span>`).join('');
        const tag = s.match === 'External' ? `<span class="tiny">خارجية · ${esc(s.host)}</span>` :
          (s.ints.length ? `<span class="tiny">${s.ints.length} تكامل</span>` : `<span class="tiny">بدون تكاملات مكتشفة</span>`);
        html += `<button class="item" role="listitem" data-s="${s.id}" aria-current="${current==='s'+s.id}"><span class="t">${esc(s.ar)}</span><span class="s">${dots}${tag}<span class="tiny">· #${s.id}</span></span></button>`;
      });
    });
  } else {
    const items = Object.values(I).filter(i => (!F.kind || i.kind === F.kind) &&
      (!q || [i.k, i.cls, i.lib, ...i.paths].join(' ').toLowerCase().includes(q)));
    KIND_ORDER.forEach(k => {
      const g = items.filter(i => i.kind === k).sort((a,b) => b.services.length - a.services.length);
      if (!g.length) return;
      html += `<div class="group">${esc(KIND[k].ar)} · ${g.length}</div>`;
      g.forEach(i => { n++;
        html += `<button class="item" role="listitem" data-i="${esc(i.k)}" aria-current="${current==='i-'+i.k}"><span class="t mono" style="font-size:13.5px">${esc(i.cls)}</span><span class="s"><span class="dot" style="background:${kcolor(i.kind)}"></span><span class="tiny">${i.services.length} خدمة · ${esc(i.lib)}</span></span></button>`;
      });
    });
  }
  list.innerHTML = html || '<div class="empty" style="padding:20px">لا نتائج. جرّب كلمة أخرى أو أزل عامل تصفية.</div>';
  $('#count').textContent = n + (tab === 'services' ? ' خدمة' : ' تكامل');
}
$('#list').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  location.hash = b.dataset.s ? 's' + b.dataset.s : 'i-' + b.dataset.i;
});

// ---------- service detail
function brief(s){
  if (s.match === 'External') return `خدمة تُقدَّم خارج بوابة SharePoint على <span class="ltr">${esc(s.host||'رابط خارجي')}</span>، لذلك لا يوجد لها كود في مستودعات البوابة.`;
  const parts = [];
  if (s.projects.length) parts.push(`تُقدَّم من مشروع <span class="mono">${esc(s.projects.join('، '))}</span> في مستودع <span class="mono">${esc(s.repos.join('، '))}</span>`);
  else if (s.match === 'WebRootOnly') parts.push(`رابطها في القائمة يشير إلى الموقع الفرعي <span class="mono">${esc(s.web)}</span> دون صفحة محددة`);
  else parts.push('لم نجد الصفحة في المستودعات');
  const ks = kindsOf(s);
  if (ks.length) parts.push(`وتتكامل مع ${ks.map(k => `<b style="color:${kcolor(k)}">${esc(KIND[k].ar)}</b>`).join(' و')} عبر ${s.ints.length} تكامل`);
  if (s.comps.length) parts.push(`وتستخدم ${s.comps.map(c => esc(COMP[c]||c)).join(' و')}`);
  return parts.join('، ') + '.';
}
function intCard(x){
  const i = I[x.k];
  return `<div class="int">
    <button class="name" data-goto="i-${esc(i.k)}">${esc(i.cls)}</button>
    <span class="lvl ${x.lvl}">${esc(LVL[x.lvl])}</span>
    <span class="tiny mono">${esc(i.lib)}${i.url ? ' · ' + esc(i.url) : ''}</span>
    ${i.methods.length ? `<details><summary>${i.methods.length} دالة</summary><ul class="plist">${i.methods.map(m => `<li>${esc(m)}</li>`).join('')}</ul></details>` : ''}
    <details><summary>أين وُجد في الكود</summary><ul class="plist">${x.ev.map(e => `<li>${esc(e)}</li>`).join('')}</ul></details>
  </div>`;
}
function showService(s){
  current = 's' + s.id;
  const groups = KIND_ORDER.map(k => [k, s.ints.filter(x => I[x.k].kind === k)]).filter(g => g[1].length);
  const review = [];
  if (s.source === 'OldRepoOnly') review.push('الصفحة موجودة في المستودع القديم Z.P.Portal فقط، لذلك لم تُربط تكاملاتها');
  if (s.projects.length > 1) review.push('الصفحة نفسها موجودة في أكثر من مشروع');
  if (s.match === 'NotFound') review.push('لم نجد صفحة بهذا المسار في المستودعات');
  if (s.match === 'WebRootOnly') review.push('الرابط لا يحدد صفحة');
  $('#detail').innerHTML = `<div class="stack">
    <button class="back" id="back">→ رجوع للقائمة</button>
    <section class="card dhead">
      <div class="chips"><span class="chip">${esc(catName(s.cat))}</span><span class="chip">رقم القائمة #${esc(s.id)}</span>
        ${review.length ? '<span class="chip warn">تحتاج مراجعة</span>' : ''}</div>
      <h2>${esc(s.ar)}</h2><div class="en">${esc(s.en)}</div>
      <div class="chips" aria-label="من يرى الخدمة">${s.ut.map(u => `<span class="chip">${esc(utName(u))}</span>`).join('') || '<span class="tiny">لم يحدد نوع المستخدم</span>'}</div>
    </section>
    <section class="card sec"><h3>الخلاصة</h3><p class="brief">${brief(s)}</p>
      ${review.length ? `<p class="tiny" style="color:var(--warn);margin:10px 0 0">${review.map(esc).join(' · ')}</p>` : ''}</section>
    <section class="card sec note"><h3>نبذة عن البيزنس</h3><div id="note"></div></section>
    ${groups.length ? `<section class="card sec"><h3>التكاملات (${s.ints.length})</h3>
      ${groups.map(([k, xs]) => `<div class="kgroup"><h4><span class="dot" style="background:${kcolor(k)}"></span>${esc(KIND[k].ar)} <span class="tiny">${esc(KIND[k].hint)}</span></h4><div class="ints">${xs.map(intCard).join('')}</div></div>`).join('')}
      <p class="tiny" style="margin:12px 0 0">الربط يتم على مستوى المشروع: «داخل كود الصفحة» أقوى دليل، و«في مكتبة يعتمد عليها المشروع» قد يخص صفحات أخرى في نفس المشروع.</p></section>` : ''}
    ${s.comps.length ? `<section class="card sec"><h3>مكونات مستخدمة</h3><div class="chips">${s.comps.map(c => `<span class="chip">${esc(COMP[c]||c)}</span>`).join('')}</div></section>` : ''}
    <section class="card sec"><h3>الروابط والكود</h3><dl class="kv">
      ${s.urlAr ? `<dt>الرابط (Staging)</dt><dd class="svc-links"><a href="${esc(s.urlAr)}" target="_blank" rel="noopener" class="ltr">${esc(s.urlAr)}</a>${s.urlEn && s.urlEn !== s.urlAr ? `<a href="${esc(s.urlEn)}" target="_blank" rel="noopener" class="ltr">${esc(s.urlEn)}</a>` : ''}</dd>` : ''}
      ${s.web ? `<dt>الموقع الفرعي</dt><dd class="mono">${esc(s.web)}</dd>` : ''}
      ${s.page ? `<dt>الصفحة</dt><dd class="mono">Pages/${esc(s.page)}</dd>` : ''}
      ${s.repos.length ? `<dt>المستودع</dt><dd class="mono">${esc(s.repos.join(' ; '))}</dd><dt>المشروع</dt><dd class="mono">${esc(s.projects.join(' ; '))}</dd>` : ''}
      ${s.webparts.length ? `<dt>Web Parts</dt><dd class="mono">${esc(s.webparts.join(' ; '))}</dd>` : ''}
      <dt>Location</dt><dd class="mono">${esc(s.loc || '—')}</dd>
    </dl></section>
  </div>`;
  renderNote(s.id);
  afterDetail();
}

// ---------- integration detail
function showIntegration(i){
  current = 'i-' + i.k;
  const svcs = i.services.map(id => byId[id]).filter(Boolean).sort((a,b) => a.ar.localeCompare(b.ar,'ar'));
  $('#detail').innerHTML = `<div class="stack">
    <button class="back" id="back">→ رجوع للقائمة</button>
    <section class="card dhead">
      <div class="chips"><span class="chip k" style="color:${kcolor(i.kind)}">${esc(KIND[i.kind].ar)}</span><span class="chip">${esc(i.lib)}</span></div>
      <h2 class="mono" style="font-size:22px;text-align:right">${esc(i.cls)}</h2>
      <div class="tiny">${esc(KIND[i.kind].hint)} · الأساس <span class="mono">${esc(i.base)}</span></div>
    </section>
    <section class="card sec"><h3>تفاصيل</h3><dl class="kv">
      ${i.url ? `<dt>العنوان (Staging)</dt><dd class="mono">${esc(i.url)}</dd>` : ''}
      <dt>مُعرّف في</dt><dd class="mono">${esc(i.defined.join(' ; ') || '—')}</dd>
      ${i.settings.length ? `<dt>مفاتيح الإعداد</dt><dd class="mono">${esc(i.settings.join(' ; '))}</dd>` : ''}
    </dl></section>
    ${i.methods.length ? `<section class="card sec"><h3>الدوال (${i.methods.length})</h3><ul class="plist" style="max-height:320px">${i.methods.map(m => `<li>${esc(m)}</li>`).join('')}</ul></section>` : ''}
    ${i.paths.length ? `<section class="card sec"><h3>المسارات (Relative paths)</h3><ul class="plist" style="max-height:320px">${i.paths.map(m => `<li>${esc(m)}</li>`).join('')}</ul></section>` : ''}
    <section class="card sec"><h3>الخدمات التي تستخدمه (${svcs.length})</h3><div class="slist">
      ${svcs.map(s => `<button data-goto="s${s.id}">${esc(s.ar)} <span class="tiny">#${s.id} · ${esc(LVL[s.ints.find(x => x.k === i.k).lvl])}</span></button>`).join('')}
    </div></section>
  </div>`;
  afterDetail();
}
function afterDetail(){
  $('#app').dataset.view = 'detail';
  $('#detail').scrollTop = 0;
  const b = $('#back'); if (b) b.onclick = () => { $('#app').dataset.view = 'list'; };
  document.querySelectorAll('#list .item').forEach(el => el.setAttribute('aria-current',
    String((el.dataset.s && current === 's' + el.dataset.s) || (el.dataset.i && current === 'i-' + el.dataset.i))));
}
$('#detail').addEventListener('click', e => { const g = e.target.closest('[data-goto]'); if (g) location.hash = g.dataset.goto; });

// ---------- business notes (shared db)
// Outside claude.ai (file opened locally) notes are kept in this browser's localStorage.
const LS_KEY = 'services-atlas-notes';
const local = {
  load(){ try { Object.assign(notes, JSON.parse(localStorage.getItem(LS_KEY) || '{}')); } catch {} },
  save(id, text){ try { const all = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); all[id] = text; localStorage.setItem(LS_KEY, JSON.stringify(all)); return true; } catch { return false; } }
};
function renderNote(id){
  const box = $('#note'); if (!box || current !== 's' + id) return;
  const text = notes[id] || '';
  if (!canWrite){
    box.innerHTML = text ? `<p class="brief" style="white-space:pre-wrap">${esc(text)}</p>` :
      `<p class="placeholder">لم تُكتب نبذة لهذه الخدمة بعد.</p>`;
    return;
  }
  if (box.dataset.editing === id) return;
  box.innerHTML = text ? `<p class="brief" style="white-space:pre-wrap">${esc(text)}</p><div class="row"><button class="btn ghost" id="edit">تعديل</button></div>`
    : `<p class="placeholder">لم تُكتب نبذة بعد: ماذا تقدم الخدمة، لمن، وما الجهة المالكة للإجراء.</p><div class="row"><button class="btn ghost" id="edit">إضافة نبذة</button></div>`;
  $('#edit').onclick = () => editNote(id);
}
function editNote(id){
  const box = $('#note'); box.dataset.editing = id;
  box.innerHTML = `<textarea id="note-text" aria-label="نبذة عن البيزنس"></textarea>
    <div class="row"><button class="btn" id="save">حفظ</button><button class="btn ghost" id="cancel">إلغاء</button><span class="tiny" id="msg"></span></div>`;
  const ta = $('#note-text'); ta.value = notes[id] || ''; ta.focus();
  $('#cancel').onclick = () => { delete box.dataset.editing; renderNote(id); };
  $('#save').onclick = async () => {
    const btn = $('#save'); btn.disabled = true; $('#msg').textContent = 'جارٍ الحفظ…';
    try {
      if (db) await db.doc('notes/s' + id).set({text: ta.value.trim(), service: id, updatedAt: new Date().toISOString()});
      else if (!local.save(id, ta.value.trim())) throw {code: 'local'};
      notes[id] = ta.value.trim(); delete box.dataset.editing; renderNote(id);
    } catch (e) {
      btn.disabled = false;
      if (e && (e.code === 'invalid_argument')) { canWrite = false; $('#msg').textContent = 'ليس لديك صلاحية التعديل على هذه الصفحة.'; }
      else $('#msg').textContent = 'تعذّر الحفظ. حاول مرة أخرى.';
    }
  };
}
(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { db = null; }
  if (!db){ local.load(); if (current && current[0] === 's') renderNote(current.slice(1)); return; }
  db.collection('notes').onSnapshot(snap => {
    snap.docs.forEach(d => { const v = d.data(); if (v && v.service) notes[v.service] = v.text || ''; });
    if (current && current[0] === 's') renderNote(current.slice(1));
  }, () => {});
  if (current && current[0] === 's') renderNote(current.slice(1));
})();

// ---------- tabs + routing
function setTab(t){
  tab = t; $('#tab-s').setAttribute('aria-selected', t === 'services'); $('#tab-i').setAttribute('aria-selected', t === 'integrations');
  F.kind = ''; buildFilters(); renderList();
}
$('#tab-s').onclick = () => setTab('services');
$('#tab-i').onclick = () => setTab('integrations');
$('#q').addEventListener('input', renderList);
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h[0] === 's' && byId[h.slice(1)]){ if (tab !== 'services') setTab('services'); showService(byId[h.slice(1)]); }
  else if (h.startsWith('i-') && I[h.slice(2)]){ if (tab !== 'integrations') setTab('integrations'); showIntegration(I[h.slice(2)]); }
}
window.addEventListener('hashchange', route);
buildFilters(); renderList();
if (location.hash) route();
else { const first = S.find(s => s.ints.length > 3) || S[0]; showService(first); $('#app').dataset.view = 'list'; }
})();
</script>
