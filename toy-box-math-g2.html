<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toy Box Math — Grade 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Baloo+Bhaijaan+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Toy Box English — Grade 2 grammar adventure
   Palette: bright low-poly platformer + toy chest wood
   ============================================================ */

:root {
  --sky-1: #9BE8FF;
  --sky-2: #45B9EE;
  --grass: #6BD44F;
  --grass-dk: #349A26;
  --wood: #D28A4C;
  --wood-dk: #8B4F23;
  --cream: #FFF8E7;
  --coin: #FFC93C;
  --berry: #FF5C7A;
  --plum: #7A4BC4;
  --mint: #22C9A0;
  --ink: #33244A;
  --ink-soft: #6A5C82;

  --edge: 4px;
  --r: 22px;
  --tap: 56px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 70%, #2E9BD4 100%);
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* ---------- scenery ---------- */
.scenery { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.hills { position: absolute; bottom: 0; left: 0; width: 100%; height: 40vh; }
.cloud {
  position: absolute;
  background: #fff;
  border-radius: 100px;
  opacity: .85;
  animation: drift linear infinite;
}
.cloud::before, .cloud::after {
  content: ""; position: absolute; background: #fff; border-radius: 50%;
}
.cloud.a { width: 130px; height: 40px; top: 10%; left: -20%; animation-duration: 70s; }
.cloud.b { width: 90px;  height: 30px; top: 26%; left: -30%; animation-duration: 95s; animation-delay: -30s; }
.cloud.c { width: 160px; height: 46px; top: 46%; left: -40%; animation-duration: 120s; animation-delay: -60s; }
.cloud::before { width: 55%; height: 160%; top: -70%; left: 12%; }
.cloud::after  { width: 40%; height: 130%; top: -50%; right: 14%; }

@keyframes drift { to { transform: translateX(160vw); } }

/* ---------- shell ---------- */
#app {
  position: relative; z-index: 1;
  max-width: 940px; margin: 0 auto;
  min-height: 100%;
  display: flex; flex-direction: column;
  padding: 12px 14px 40px;
}

.hud {
  display: flex; align-items: center; gap: 10px;
  background: var(--cream);
  border: var(--edge) solid var(--ink);
  border-radius: 18px;
  box-shadow: 0 6px 0 var(--ink);
  padding: 8px 10px;
  margin-bottom: 22px;
}

.hud-title {
  font-family: "Baloo 2", "Nunito", sans-serif;
  font-weight: 800; font-size: 1.15rem; line-height: 1;
  letter-spacing: .3px;
  margin-inline-end: auto;
}
.hud-title small { display: block; font-size: .68rem; color: var(--ink-soft); font-weight: 700; letter-spacing: 1.5px; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: #fff; border: 3px solid var(--ink); border-radius: 999px;
  padding: 5px 12px; font-weight: 800; font-size: 1rem;
}
.pill b { font-variant-numeric: tabular-nums; }

.icon-btn {
  width: 44px; height: 44px; flex: 0 0 auto;
  border: 3px solid var(--ink); border-radius: 14px;
  background: #fff; box-shadow: 0 4px 0 var(--ink);
  font-size: 1.15rem; cursor: pointer;
  display: grid; place-items: center;
  font-family: inherit; font-weight: 800;
  transition: transform .08s, box-shadow .08s;
}
.icon-btn.on { background: var(--coin); }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

/* ---------- screens ---------- */
.screen { display: none; animation: pop .28s ease-out; }
.screen.active { display: block; }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.98); } }

.hero-title {
  font-family: "Baloo 2", sans-serif;
  font-size: clamp(1.9rem, 7vw, 3rem);
  line-height: 1.05; text-align: center;
  color: #fff; margin: 0 0 4px;
  text-shadow: 0 4px 0 var(--wood-dk), 0 8px 14px rgba(0,0,0,.2);
}
.hero-sub { text-align: center; color: #06344B; font-weight: 800; margin: 0 0 26px; }

/* ---------- level path ---------- */
.path { position: relative; padding: 8px 0 20px; }
.path::before {
  content: ""; position: absolute; top: 30px; bottom: 30px; left: 50%;
  border-left: 9px dashed rgba(255,255,255,.75); transform: translateX(-50%);
}
.node {
  position: relative; width: min(320px, 82%);
  background: var(--cream);
  border: var(--edge) solid var(--ink);
  border-radius: var(--r);
  box-shadow: 0 7px 0 var(--ink);
  padding: 12px 14px; margin-bottom: 20px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; text-align: start;
  font-family: inherit; font-size: 1rem; color: var(--ink);
  transition: transform .12s, box-shadow .12s;
}
.node:nth-child(odd) { margin-inline-end: auto; }
.node:nth-child(even) { margin-inline-start: auto; }
.node:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 0 var(--ink); }
.node:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.node:disabled { cursor: not-allowed; filter: grayscale(.75); opacity: .8; }
.node.current { border-color: var(--plum); animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-6px); } }

.node-badge {
  width: 58px; height: 58px; flex: 0 0 auto;
  border-radius: 50%; border: 3px solid var(--ink);
  display: grid; place-items: center;
  font-family: "Baloo 2", sans-serif; font-size: 1.5rem; font-weight: 800;
  background: var(--coin); color: var(--ink);
}
.node.l2 .node-badge { background: var(--mint); }
.node.l3 .node-badge { background: var(--berry); color: #fff; }
.node.l4 .node-badge { background: var(--plum); color: #fff; }
.node-txt strong { display: block; font-family: "Baloo 2", sans-serif; font-size: 1.12rem; }
.node-txt span { font-size: .85rem; color: var(--ink-soft); font-weight: 700; }
.stars { letter-spacing: 2px; font-size: .95rem; }

.node-mascot {
  position: absolute; top: -34px; inset-inline-end: -10px;
  width: 62px; animation: hop 1.1s ease-in-out infinite;
}
@keyframes hop { 50% { transform: translateY(-8px) rotate(-4deg); } }

/* ---------- cards ---------- */
.card {
  background: var(--cream);
  border: var(--edge) solid var(--ink);
  border-radius: 26px;
  box-shadow: 0 8px 0 var(--ink);
  padding: 18px;
  margin-bottom: 16px;
}
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.avatar { width: 74px; flex: 0 0 auto; }
.bubble {
  position: relative; background: #fff;
  border: 3px solid var(--ink); border-radius: 16px;
  padding: 10px 13px; font-weight: 700; flex: 1;
}
.bubble::after {
  content: ""; position: absolute; inset-inline-start: -11px; top: 22px;
  width: 0; height: 0;
  border: 8px solid transparent; border-inline-end-color: var(--ink);
}

h2.step-title {
  font-family: "Baloo 2", sans-serif;
  font-size: 1.5rem; margin: 4px 0 6px; color: var(--plum);
}
.lead { font-size: 1.06rem; font-weight: 700; margin: 0 0 12px; }
.lead em { font-style: normal; background: var(--coin); padding: 0 5px; border-radius: 6px; }

.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  background: #fff; border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 4px 0 var(--ink);
  padding: 9px 13px; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  font-family: inherit; font-size: 1rem; color: var(--ink);
}
.chip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.chip .emo { font-size: 1.4rem; }
.chip .tag { font-size: .7rem; color: var(--ink-soft); display: block; font-weight: 700; }

.ar {
  direction: rtl; text-align: right;
  font-family: "Baloo Bhaijaan 2", "Nunito", sans-serif;
  background: #EFF7FF; border: 2px dashed var(--plum);
  border-radius: 14px; padding: 8px 12px; margin-top: 12px;
  font-weight: 700; color: #3A2C5C;
}
body:not(.show-ar) .ar { display: none; }

/* ---------- buttons ---------- */
.row { display: flex; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }

.btn {
  min-height: var(--tap);
  border: var(--edge) solid var(--ink); border-radius: 18px;
  background: #fff; color: var(--ink);
  box-shadow: 0 6px 0 var(--ink);
  font-family: "Baloo 2", "Nunito", sans-serif;
  font-size: 1.1rem; font-weight: 800;
  padding: 10px 20px; cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.go { background: var(--mint); }
.btn.play { background: var(--coin); }
.btn.ghost { background: transparent; box-shadow: 0 4px 0 var(--ink); }
.btn.wide { width: 100%; }

/* ---------- quiz ---------- */
.bar {
  height: 20px; background: var(--cream);
  border: 3px solid var(--ink); border-radius: 999px;
  overflow: hidden; margin-bottom: 14px;
}
.bar i { display: block; height: 100%; background: var(--mint); width: 0; transition: width .35s; }

.q-text { font-family: "Baloo 2", sans-serif; font-size: 1.35rem; margin: 0 0 4px; }
.q-hint { font-weight: 700; color: var(--ink-soft); margin: 0 0 14px; font-size: .95rem; }

.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.opt {
  min-height: var(--tap);
  background: #fff; border: var(--edge) solid var(--ink); border-radius: 18px;
  box-shadow: 0 6px 0 var(--ink);
  font-family: "Baloo 2", "Nunito", sans-serif; font-size: 1.15rem; font-weight: 800;
  color: var(--ink); padding: 12px; cursor: pointer;
  transition: transform .08s, box-shadow .08s, background .15s;
}
.opt:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.opt.right { background: var(--mint); }
.opt.wrong { background: var(--berry); color: #fff; animation: shake .35s; }
.opt.dim { opacity: .5; }
@keyframes shake {
  25% { transform: translateX(-7px); } 75% { transform: translateX(7px); }
}

.sentence { display: flex; flex-wrap: wrap; gap: 8px; font-size: 1.2rem; margin-bottom: 6px; }
.word {
  background: #fff; border: 3px solid var(--ink); border-radius: 12px;
  box-shadow: 0 4px 0 var(--ink);
  padding: 9px 12px; font-weight: 800; cursor: pointer;
  font-family: inherit; font-size: 1.1rem; color: var(--ink);
}
.word.right { background: var(--mint); }
.word.wrong { background: var(--berry); color: #fff; animation: shake .35s; }
.word.plain { box-shadow: none; border-style: dashed; cursor: default; }

.slot {
  min-height: 66px; background: #fff;
  border: 3px dashed var(--plum); border-radius: 16px;
  padding: 10px; margin-bottom: 12px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.slot:empty::before { content: "Tap the words in order →"; color: var(--ink-soft); font-weight: 700; }

.baskets { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 14px; }
.basket {
  min-height: 78px;
  background: var(--wood); color: #fff;
  border: var(--edge) solid var(--wood-dk); border-radius: 18px;
  box-shadow: 0 6px 0 var(--wood-dk);
  font-family: "Baloo 2", sans-serif; font-size: 1.05rem; font-weight: 800;
  cursor: pointer; padding: 10px;
}
.basket:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--wood-dk); }
.basket.right { background: var(--mint); border-color: #147F63; box-shadow: 0 6px 0 #147F63; }
.basket.wrong { background: var(--berry); border-color: #B0304A; box-shadow: 0 6px 0 #B0304A; animation: shake .35s; }

.big-word {
  font-family: "Baloo 2", sans-serif; font-size: 2.2rem; text-align: center;
  background: #fff; border: var(--edge) solid var(--ink); border-radius: 20px;
  padding: 14px; box-shadow: 0 6px 0 var(--ink);
}

.feedback {
  margin-top: 14px; padding: 12px 14px;
  border: 3px solid var(--ink); border-radius: 16px;
  font-weight: 800; display: none;
}
.feedback.show { display: block; animation: pop .2s; }
.feedback.good { background: #D6FBEF; }
.feedback.bad { background: #FFE3E9; }

.coin-fly {
  position: fixed; z-index: 50; font-size: 2rem; pointer-events: none;
  animation: fly .9s ease-out forwards;
}
@keyframes fly {
  to { transform: translate(0, -140px) scale(1.5); opacity: 0; }
}

/* ---------- results ---------- */
.result { text-align: center; }
.result .big-stars { font-size: 3rem; letter-spacing: 6px; }
.result h2 { font-family: "Baloo 2", sans-serif; font-size: 2rem; margin: 6px 0; color: var(--plum); }
.trophy { width: 130px; margin: 0 auto 6px; display: block; }

.footnote { text-align: center; color: #06344B; font-weight: 700; font-size: .85rem; margin-top: 10px; }

/* ---------- a11y / motion ---------- */
:focus-visible { outline: 4px solid var(--plum); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

@media (max-width: 520px) {
  .hud-title { font-size: .98rem; }
  .avatar { width: 58px; }
  .node { width: 100%; }
  .path::before { display: none; }
  .options { grid-template-columns: 1fr 1fr; }
}

/* ---------- character reactions & custom pictures ---------- */
.feedback { display: none; align-items: center; gap: 10px; }
.feedback.show { display: flex; }

.fb-avatar { width: 52px; flex: 0 0 auto; }
.fb-avatar.cheer { animation: cheer .55s ease-out 2; }
.fb-avatar.oops { animation: wobble .5s ease-in-out; }

@keyframes cheer {
  0%, 100% { transform: translateY(0) rotate(0); }
  40% { transform: translateY(-14px) rotate(-8deg) scale(1.08); }
  70% { transform: translateY(0) rotate(6deg); }
}
@keyframes wobble {
  20% { transform: rotate(-9deg); } 50% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); }
}

/* the talking character bounces gently while reading a step */
.card-head .avatar { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: translateY(-6px) rotate(-2deg); } }

/* frame for user-supplied pictures so they match the drawn style */
img.photo {
  border: 4px solid var(--ink);
  border-radius: 18px;
  background: #fff;
  object-fit: cover;
  aspect-ratio: 1 / 1;
  height: auto;
}
img.photo.node-mascot { border-radius: 50%; }

/* ---------- toy chest picker ---------- */
.chest {
  background: rgba(255,255,255,.35);
  border: 3px dashed #fff;
  border-radius: 22px;
  padding: 10px 12px 6px;
  margin-bottom: 22px;
}
.chest-label {
  margin: 0 0 8px; font-family: "Baloo 2", sans-serif; font-size: 1.05rem;
  color: #06344B; text-align: center;
}
.ar-inline { font-family: "Baloo Bhaijaan 2", sans-serif; direction: rtl; }
.pickrow {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
  scrollbar-width: thin;
}
.pick {
  flex: 0 0 auto; width: 88px;
  background: var(--cream); border: 3px solid var(--ink); border-radius: 18px;
  box-shadow: 0 4px 0 var(--ink);
  padding: 6px 4px; cursor: pointer;
  font-family: "Baloo 2", "Nunito", sans-serif; font-weight: 800; font-size: .82rem;
  color: var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.pick:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.pick.on { background: var(--coin); border-color: var(--plum); box-shadow: 0 4px 0 var(--plum); }
.pickimg { width: 60px; height: 60px; }

/* ---------- character pictures ---------- */
.toy { object-fit: contain; filter: drop-shadow(0 5px 3px rgba(0,0,0,.28)); }
.avatar.toy { width: 96px; height: 96px; }
.node-mascot.toy { width: 76px; height: 76px; top: -46px; }
.fb-avatar.toy { width: 58px; height: 58px; }
.toy.fallback { display: grid; place-items: center; font-size: 2rem; }

@media (max-width: 520px) {
  .avatar.toy { width: 74px; height: 74px; }
  .pick { width: 78px; }
  .pickimg { width: 52px; height: 52px; }
}

/* ============ maths extras ============ */
.visual { display: flex; justify-content: center; margin: 6px 0 14px; }

/* base-ten blocks */
.base10 { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; justify-content: center; }
.rods, .cubes { display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; max-width: 220px; }
.rod {
  width: 22px; height: 112px;
  background: repeating-linear-gradient(180deg, #2FD3A8 0 9.2px, #1B8E71 9.2px 11.2px);
  border: 3px solid var(--ink); border-radius: 5px;
}
.cube {
  width: 22px; height: 22px; background: #FFC93C;
  border: 3px solid var(--ink); border-radius: 5px;
}

/* arrays */
.array { display: flex; flex-direction: column; gap: 8px; }
.arow { display: flex; gap: 8px; }
.array .dot { width: 24px; height: 24px; border-radius: 50%; background: var(--berry); border: 3px solid var(--ink); }

/* clock */
.clock { width: 190px; height: 190px; }

/* number keypad */
.entry {
  font-family: "Baloo 2", sans-serif; font-size: 2.6rem; font-weight: 800;
  text-align: center; background: #fff; color: var(--ink);
  border: 4px solid var(--ink); border-radius: 18px;
  padding: 6px 10px; margin: 0 auto 14px; max-width: 240px;
  letter-spacing: 3px; font-variant-numeric: tabular-nums;
}
.entry.right { background: var(--mint); }
.entry.wrong { background: var(--berry); color: #fff; animation: shake .35s; }

.keys {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px; max-width: 320px; margin: 0 auto;
}
.key {
  min-height: 62px;
  font-family: "Baloo 2", sans-serif; font-size: 1.6rem; font-weight: 800; color: var(--ink);
  background: #fff; border: 4px solid var(--ink); border-radius: 16px;
  box-shadow: 0 5px 0 var(--ink); cursor: pointer;
}
.key:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.key.go { background: var(--mint); }
.key.wide { background: var(--coin); }
.key:disabled { opacity: .45; cursor: not-allowed; }

@media (max-width: 520px) {
  .rod { height: 92px; width: 18px; }
  .cube { width: 18px; height: 18px; }
  .clock { width: 150px; height: 150px; }
  .array .dot { width: 20px; height: 20px; }
}

</style>
</head>
<body>

<!-- background scenery -->
<div class="scenery" aria-hidden="true">
  <div class="cloud a"></div><div class="cloud b"></div><div class="cloud c"></div>
  <svg class="hills" viewBox="0 0 1200 400" preserveAspectRatio="none">
    <polygon points="0,240 180,120 340,250 520,140 700,260 880,150 1060,250 1200,180 1200,400 0,400" fill="#4FA83B"/>
    <polygon points="0,300 200,210 400,320 620,230 820,330 1040,240 1200,310 1200,400 0,400" fill="#6BD44F"/>
    <polygon points="0,360 150,330 320,368 500,336 700,372 900,340 1100,370 1200,350 1200,400 0,400" fill="#8CE86A"/>
  </svg>
</div>

<div id="app">
  <header class="hud">
    <button class="icon-btn" id="btnHome" title="Map" aria-label="Go to map">🏠</button>
    <div class="hud-title">Toy Box Math<small>GRADE 2 NUMBERS</small></div>
    <span class="pill" id="coinPill">🪙 <b id="coinCount">0</b></span>
    <button class="icon-btn" id="btnLang" title="Arabic help" aria-label="Show Arabic help">عربي</button>
    <button class="icon-btn" id="btnSound" title="Sound" aria-label="Toggle sound">🔊</button>
  </header>

  <main>
    <section class="screen" id="screen-map"></section>
    <section class="screen" id="screen-learn"></section>
    <section class="screen" id="screen-quiz"></section>
    <section class="screen" id="screen-done"></section>
  </main>
</div>

<script>
/* ============================================================
   Toy Box Math — Grade 2
   Tens & ones · add and subtract to 100 · skip counting and arrays
   · telling time and word problems

/* ---------------- maths visuals ---------------- */
function base10(tens, ones) {
  return `<div class="base10">
    <div class="rods">${Array.from({ length: tens }, () => `<span class="rod"></span>`).join("")}</div>
    <div class="cubes">${Array.from({ length: ones }, () => `<span class="cube"></span>`).join("")}</div>
  </div>`;
}
function arrayDots(rows, cols) {
  return `<div class="array">${Array.from({ length: rows }, () =>
    `<div class="arow">${Array.from({ length: cols }, () => `<span class="dot"></span>`).join("")}</div>`).join("")}</div>`;
}
function clockSVG(h, m) {
  const pt = (deg, r) => {
    const a = (deg - 90) * Math.PI / 180;
    return [50 + r * Math.cos(a), 50 + r * Math.sin(a)];
  };
  const [hx, hy] = pt((h % 12) * 30 + m * 0.5, 24);
  const [mx, my] = pt(m * 6, 34);
  const ticks = Array.from({ length: 12 }, (_, i) => {
    const [x1, y1] = pt(i * 30, 40), [x2, y2] = pt(i * 30, 44);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#33244A" stroke-width="${i % 3 ? 2 : 4}"/>`;
  }).join("");
  const nums = [[12, 0], [3, 90], [6, 180], [9, 270]].map(([n, d]) => {
    const [x, y] = pt(d, 32);
    return `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="11" font-weight="800" fill="#33244A">${n}</text>`;
  }).join("");
  return `<svg viewBox="0 0 100 100" class="clock" role="img" aria-label="clock">
    <circle cx="50" cy="50" r="47" fill="#FFF8E7" stroke="#33244A" stroke-width="5"/>
    ${ticks}${nums}
    <line x1="50" y1="50" x2="${hx}" y2="${hy}" stroke="#33244A" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="${mx}" y2="${my}" stroke="#FF5C7A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="4" fill="#33244A"/>
  </svg>`;
}

        say: "The short hand shows the hour. The long pink hand shows the minutes.",
        lead: "short hand = <em>hour</em> &nbsp;·&nbsp; long hand = <em>minutes</em>",
        visual: clockSVG(3, 0),
        ar: "العقرب القصير = الساعة، والطويل (الوردي) = الدقايق. الصورة دي 3 o'clock." },
      { who: "jessie", title: "Half past and quarter past",
        say: "When the long hand points down, it is half past.",
        lead: "long hand on 6 = <em>half past</em> &nbsp;·&nbsp; long hand on 3 = <em>quarter past</em>",
        visual: clockSVG(7, 30),
        ar: "العقرب الطويل على 6 يعني ونص (half past)، وعلى 3 يعني وربع (quarter past)." },
      { who: "woody", title: "Word problems: find the numbers first",
        say: "Read it twice. Are we putting together, or taking away?",
        lead: "“found <em>more</em>” → add &nbsp;·&nbsp; “<em>gave away</em>” → subtract",
        ar: "في المسائل الكلامية: هات الأرقام الأول، وبعدين اسأل نفسك — هنجمع ولا هنطرح؟" }
    ],
    qs: [
      { kind: "choice", q: "What time is it?", visual: clockSVG(3, 0),
        options: ["3 o'clock", "12 o'clock", "half past 3"], answer: 0, ar: "العقرب الطويل على 12." },
      { kind: "choice", q: "What time is it?", visual: clockSVG(7, 30),
        options: ["half past 7", "half past 6", "7 o'clock"], answer: 0, ar: "العقرب القصير عدّى 7 والطويل على 6." },
      { kind: "choice", q: "What time is it?", visual: clockSVG(2, 15),
        options: ["2:15", "3:15", "2:45"], answer: 0, ar: "العقرب الطويل على 3 يعني 15 دقيقة." },
      { kind: "choice", q: "What time is it?", visual: clockSVG(9, 45),
        options: ["9:45", "10:45", "9:15"], answer: 0, ar: "العقرب الطويل على 9 يعني 45 دقيقة." },
      { kind: "keypad", q: "Woody has 24 coins. He finds 15 more. How many now?", answer: 39,
        say: "Woody has 24 coins and finds 15 more. How many coins now?", ar: "«more» يعني جمع: 24 + 15." },
      { kind: "keypad", q: "Buzz had 45 stickers and gave 12 away. How many are left?", answer: 33,
        say: "Buzz had 45 stickers and gave 12 away. How many are left?", ar: "«gave away» يعني طرح: 45 − 12." },
      { kind: "keypad", q: "5 boxes with 4 toys in each. How many toys?", answer: 20, visual: arrayDots(5, 4),
        say: "Five boxes with four toys in each. How many toys altogether?", ar: "5 صفوف × 4 = عدّ بالقفز: 4، 8، 12، 16، 20." }
    ]
  }
];

/* ---------------- state ---------------- */
const state = { coins: 0, stars: [0, 0, 0, 0], li: 0, si: 0, qi: 0,
                firstTry: 0, attempt: 0, built: [], entry: "",
                sound: true, ar: false, buddy: "woody" };
const $ = (s) => document.querySelector(s);
const screens = {};

let actx;
function beep(f, dur = 0.12) {
  if (!state.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    f.forEach((hz, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * dur;
      o.type = "triangle"; o.frequency.value = hz;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    });
  } catch (e) {}
}
const good = () => beep([660, 880, 1180]);
const bad = () => beep([300, 210], 0.16);
const win = () => beep([523, 659, 784, 1046], 0.15);

function speak(t) {
  if (!state.sound || !t || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "en-US"; u.rate = 0.85; u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}
function show(n) {
  Object.values(screens).forEach((s) => s.classList.remove("active"));
  screens[n].classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}
const starStr = (n) => "★★★".slice(0, n) + "☆☆☆".slice(0, 3 - n);
function addCoins(n) {
  state.coins += n;
  $("#coinCount").textContent = state.coins;
  const f = document.createElement("div");
  f.className = "coin-fly"; f.textContent = "🪙";
  const r = $("#coinPill").getBoundingClientRect();
  f.style.left = r.left + "px"; f.style.top = r.top + "px";
  document.body.appendChild(f); setTimeout(() => f.remove(), 900);
  save();
}
async function save() {
  try { if (window.storage) await window.storage.set("g2-math", JSON.stringify({ c: state.coins, s: state.stars })); } catch (e) {}
}
async function load() {
  try {
    if (window.storage) {
      const r = await window.storage.get("g2-math");
      if (r && r.value) { const d = JSON.parse(r.value); state.coins = d.c || 0; state.stars = d.s || state.stars; }
    }
  } catch (e) {}
}

/* ---------------- map ---------------- */
function renderMap() {
  const current = state.stars.findIndex((s) => s === 0);
  screens.map.innerHTML = `
    <h1 class="hero-title">Toy Box Math</h1>
    <p class="hero-sub">Grade 2 · Pick a level and start playing</p>
    <div class="chest">
      <p class="chest-label">Choose your buddy <span class="ar-inline">اختار صاحبك</span></p>
      <div class="pickrow">
        ${Object.keys(CHARACTERS).map((k) => `
          <button class="pick ${state.buddy === k ? "on" : ""}" data-buddy="${k}">
            ${art(k, "pickimg")}<span>${CHARACTERS[k].name}</span>
          </button>`).join("")}
      </div>
    </div>
    <div class="path">
      ${LEVELS.map((L, i) => {
        const locked = i > 0 && state.stars[i - 1] === 0;
        const cur = i === current && !locked;
        return `<button class="node ${L.cls} ${cur ? "current" : ""}" data-lvl="${i}" ${locked ? "disabled" : ""}>
          <span class="node-badge">${locked ? "🔒" : i + 1}</span>
          <span class="node-txt"><strong>${L.name}</strong><span>${L.sub}</span>
          <span class="stars">${state.stars[i] ? starStr(state.stars[i]) : (locked ? "Finish the level before" : "Not played yet")}</span></span>
          ${cur ? art(state.buddy, "node-mascot") : ""}
        </button>`;
      }).join("")}
    </div>
    <p class="footnote">Tip: 🔊 reads the question out loud · اضغط "عربي" لعرض شرح الحل بالعربية</p>`;

  screens.map.querySelectorAll(".node").forEach((n) =>
    n.addEventListener("click", () => startLevel(+n.dataset.lvl)));
  screens.map.querySelectorAll(".pick").forEach((p) =>
    p.addEventListener("click", () => {
      state.buddy = p.dataset.buddy; beep([784, 988]);
      speak(CHARACTERS[state.buddy].name + " is with you!");
      renderMap();
    }));
}

/* ---------------- teaching ---------------- */
function startLevel(i) { state.li = i; state.si = 0; state.qi = 0; state.firstTry = 0; renderStep(); show("learn"); }

function renderStep() {
  const L = LEVELS[state.li], s = L.steps[state.si], last = state.si === L.steps.length - 1;
  screens.learn.innerHTML = `
    <div class="card">
      <div class="card-head">${art(s.who)}<div class="bubble">${s.say}</div></div>
      <h2 class="step-title">${s.title}</h2>
      <p class="lead">${s.lead}</p>
      ${s.visual ? `<div class="visual">${s.visual}</div>` : ""}
      <div class="ar">${s.ar}</div>
    </div>
    <div class="row">
      <button class="btn ghost" id="back">← Back</button>
      <button class="btn play" id="listen">🔊 Listen</button>
      <span class="spacer"></span>
      <button class="btn go" id="next">${last ? "Play the game →" : "Next →"}</button>
    </div>
    <p class="footnote">Step ${state.si + 1} of ${L.steps.length} · ${L.name}</p>`;

  $("#listen").onclick = () => speak(s.say + " " + s.title);
  $("#back").onclick = () => { if (state.si === 0) { renderMap(); show("map"); } else { state.si--; renderStep(); } };
  $("#next").onclick = () => { if (last) { state.qi = 0; renderQ(); show("quiz"); } else { state.si++; renderStep(); } };
}

/* ---------------- questions ---------------- */
function renderQ() {
  const L = LEVELS[state.li], q = L.qs[state.qi];
  state.attempt = 0; state.built = []; state.entry = "";
  const pct = (state.qi / L.qs.length) * 100;

  screens.quiz.innerHTML = `
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="card">
      <p class="q-text">${q.q}</p>
      ${q.visual ? `<div class="visual">${q.visual}</div>` : ""}
      <div id="body"></div>
      <div class="ar">${q.ar || ""}</div>
      <div class="feedback" id="fb"></div>
    </div>
    <div class="row">
      <button class="btn ghost" id="quit">🏠 Map</button>
      <button class="btn play" id="hear">🔊 Read it</button>
      <span class="spacer"></span>
      <span class="pill">Q ${state.qi + 1}/${L.qs.length}</span>
    </div>`;

  $("#quit").onclick = () => { window.speechSynthesis?.cancel(); renderMap(); show("map"); };
  $("#hear").onclick = () => speak(q.say || q.q);

  ({ choice: choiceQ, keypad: keypadQ, build: buildQ })[q.kind](q);
}

function feedback(ok, msg) {
  const box = $("#fb");
  box.className = "feedback show " + (ok ? "good" : "bad");
  box.innerHTML = `${art(state.buddy, "fb-avatar " + (ok ? "cheer" : "oops"))}<span>${msg}</span>`;
}
function nextQ(delay = 1100) {
  setTimeout(() => {
    const L = LEVELS[state.li];
    if (state.qi < L.qs.length - 1) { state.qi++; renderQ(); } else finish();
  }, delay);
}
function scoreHit() { if (state.attempt === 0) { state.firstTry++; addCoins(10); } else addCoins(4); }

/* -- multiple choice -- */
function choiceQ(q) {
  $("#body").innerHTML = `<div class="options">${
    q.options.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>`;
  $("#body").querySelectorAll(".opt").forEach((b) =>
    b.addEventListener("click", () => {
      if (b.disabled) return;
      const i = +b.dataset.i;
      if (i === q.answer) {
        b.classList.add("right"); good(); scoreHit();
        feedback(true, "Correct! " + q.options[q.answer]);
        speak(q.options[q.answer]);
        $("#body").querySelectorAll(".opt").forEach((x) => (x.disabled = true));
        nextQ();
      } else {
        b.classList.add("wrong"); b.disabled = true; bad(); state.attempt++;
        if (state.attempt === 1) feedback(false, "Not that one — look again.");
        else {
          $(`#body .opt[data-i="${q.answer}"]`).classList.add("right");
          feedback(false, "The answer is: " + q.options[q.answer]);
          $("#body").querySelectorAll(".opt").forEach((x) => (x.disabled = true));
          nextQ(1900);
        }
      }
    }));
}

/* -- number keypad -- */
function keypadQ(q) {
  $("#body").innerHTML = `
    <div class="entry" id="entry">–</div>
    <div class="keys">
      ${[1,2,3,4,5,6,7,8,9].map((n) => `<button class="key" data-k="${n}">${n}</button>`).join("")}
      <button class="key wide" data-k="del">⌫</button>
      <button class="key" data-k="0">0</button>
      <button class="key go" data-k="ok" id="okKey">✔</button>
    </div>`;

  const entry = $("#entry");
  const paint = () => { entry.textContent = state.entry === "" ? "–" : state.entry; };

  $("#body").querySelectorAll(".key").forEach((k) =>
    k.addEventListener("click", () => {
      if (k.disabled) return;
      const v = k.dataset.k;
      if (v === "del") { state.entry = state.entry.slice(0, -1); beep([420]); return paint(); }
      if (v !== "ok") {
        if (state.entry.length < 4) { state.entry += v; beep([740]); }
        return paint();
      }
      if (state.entry === "") return;
      const val = parseInt(state.entry, 10);
      if (val === q.answer) {
        entry.classList.add("right"); good(); scoreHit();
        feedback(true, "Correct! " + q.answer);
        speak("Correct. " + q.answer);
        $("#body").querySelectorAll(".key").forEach((x) => (x.disabled = true));
        nextQ(1300);
      } else {
        entry.classList.add("wrong"); bad(); state.attempt++;
        setTimeout(() => entry.classList.remove("wrong"), 400);
        state.entry = ""; paint();
        if (state.attempt === 1) feedback(false, "Not quite — try once more.");
        else {
          feedback(false, "The answer is " + q.answer);
          speak("The answer is " + q.answer);
          entry.textContent = q.answer; entry.classList.add("right");
          $("#body").querySelectorAll(".key").forEach((x) => (x.disabled = true));
          nextQ(2400);
        }
      }
    }));
  paint();
}

/* -- order the numbers -- */
function buildQ(q) {
  let pool = shuffle(q.tiles.map((t, i) => i));
  state.built = [];
  $("#body").innerHTML = `
    <div class="slot" id="slot"></div>
    <div class="sentence" id="pool"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost" id="clear">↺ Clear</button>
      <button class="btn go" id="check" disabled>Check ✔</button>
    </div>`;

  function draw() {
    const slot = $("#slot"), poolEl = $("#pool");
    slot.innerHTML = state.built.map((i) => `<button class="word" data-i="${i}">${q.tiles[i]}</button>`).join("");
    poolEl.innerHTML = pool.map((i) => `<button class="word" data-i="${i}">${q.tiles[i]}</button>`).join("");
    poolEl.querySelectorAll(".word").forEach((b) => b.addEventListener("click", () => {
      const i = +b.dataset.i; pool = pool.filter((x) => x !== i); state.built.push(i); beep([760]); draw();
    }));
    slot.querySelectorAll(".word").forEach((b) => b.addEventListener("click", () => {
      const i = +b.dataset.i; state.built = state.built.filter((x) => x !== i); pool.push(i); beep([520]); draw();
    }));
    $("#check").disabled = state.built.length !== q.tiles.length;
  }
  draw();

  $("#clear").onclick = () => { pool = shuffle(q.tiles.map((t, i) => i)); state.built = []; $("#fb").className = "feedback"; draw(); };
  $("#check").onclick = () => {
    const made = state.built.map((i) => q.tiles[i]).join(" ");
    if (made === q.answer) {
      good(); scoreHit();
      $("#slot").querySelectorAll(".word").forEach((w) => w.classList.add("right"));
      feedback(true, "Correct! " + q.answer);
      speak(q.answer.split(" ").join(", "));
      $("#check").disabled = true; nextQ(1500);
    } else {
      bad(); state.attempt++;
      const ws = $("#slot").querySelectorAll(".word");
      ws.forEach((w) => w.classList.add("wrong"));
      setTimeout(() => ws.forEach((w) => w.classList.remove("wrong")), 400);
      if (state.attempt === 1) feedback(false, "Close! Which one is smallest?");
      else { feedback(false, "The order is: " + q.answer); $("#check").disabled = true; nextQ(2400); }
    }
  };
}

/* ---------------- results ---------------- */
function finish() {
  const L = LEVELS[state.li], total = L.qs.length, pct = state.firstTry / total;
  const stars = pct >= 0.9 ? 3 : pct >= 0.65 ? 2 : 1;
  state.stars[state.li] = Math.max(state.stars[state.li], stars);
  save(); win();

  const nextI = state.li + 1;
  screens.done.innerHTML = `
    <div class="card result">
      ${art(state.buddy, "avatar")}
      <div class="big-stars">${starStr(stars)}</div>
      <h2>Level complete!</h2>
      <p class="lead">${L.name} · ${state.firstTry} of ${total} right on the first try</p>
      <span class="pill">🪙 <b>${state.coins}</b> coins</span>
      <div class="ar">خلصت المستوى! ${state.firstTry} من ${total} صح من أول مرة. جرّب تاني لو عايز 3 نجوم ⭐</div>
      <div class="row" style="margin-top:18px">
        <button class="btn ghost" id="again">↺ Play again</button>
        <span class="spacer"></span>
        ${nextI < LEVELS.length ? `<button class="btn go" id="cont">Next level →</button>`
                                : `<button class="btn go" id="tomap">🏠 Map</button>`}
      </div>
    </div>`;

  $("#again").onclick = () => startLevel(state.li);
  if (nextI < LEVELS.length) $("#cont").onclick = () => startLevel(nextI);
  else $("#tomap").onclick = () => { renderMap(); show("map"); };
  show("done");
}

/* ---------------- boot ---------------- */
(async function init() {
  ["map", "learn", "quiz", "done"].forEach((n) => (screens[n] = $("#screen-" + n)));
  await load();
  $("#coinCount").textContent = state.coins;
  $("#btnHome").onclick = () => { window.speechSynthesis?.cancel(); renderMap(); show("map"); };
  $("#btnLang").onclick = (e) => {
    state.ar = !state.ar;
    document.body.classList.toggle("show-ar", state.ar);
    e.currentTarget.classList.toggle("on", state.ar);
  };
  $("#btnSound").onclick = (e) => {
    state.sound = !state.sound;
    if (!state.sound) window.speechSynthesis?.cancel();
    e.currentTarget.textContent = state.sound ? "🔊" : "🔇";
    e.currentTarget.classList.toggle("on", state.sound);
  };
  $("#btnSound").classList.add("on");
  renderMap(); show("map");
})();

</script>
</body>
